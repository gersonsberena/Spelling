<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spelling Practice</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <h1>Spelling Practice</h1>

    <section id="setup-screen" class="screen">
      <div class="mode-toggle">
        <label class="mode-option">
          <input type="radio" name="mode" id="mode-practice" value="practice" checked />
          Practice words
        </label>
        <label class="mode-option">
          <input type="radio" name="mode" id="mode-retest" value="retest" />
          Retest missed words
        </label>
      </div>

      <div id="word-count-field">
        <label for="word-count">How many words today?</label>
        <select id="word-count">
          <option value="10">10</option>
          <option value="20" selected>20</option>
          <option value="30">30</option>
          <option value="40">40</option>
          <option value="50">50</option>
        </select>
      </div>

      <p id="retest-note" class="note" hidden></p>

      <button id="start-btn">Start</button>
      <button id="history-btn" class="secondary-btn">View history</button>
      <p id="setup-error" class="error" hidden></p>
    </section>

    <section id="quiz-screen" class="screen" hidden>
      <div class="quiz-header">
        <p class="progress"><span id="progress-current"></span> / <span id="progress-total"></span></p>
        <button id="restart-quiz-btn" class="secondary-btn small">Restart</button>
      </div>

      <button id="hear-word-btn" class="speak-btn">🔊 Hear the word</button>

      <div class="info-panel">
        <p><strong>Part of speech:</strong> <span id="part-of-speech"></span>
          <button class="speak-btn small" data-speak-target="part-of-speech">🔊</button>
        </p>
        <p><strong>Definition:</strong> <span id="definition"></span>
          <button class="speak-btn small" data-speak-target="definition">🔊</button>
        </p>
        <p><strong>Sentence:</strong> <span id="sentence"></span>
          <button class="speak-btn small" data-speak-target="sentence">🔊</button>
        </p>
      </div>

      <form id="answer-form" autocomplete="off">
        <label for="answer-input">Type the word:</label>
        <input id="answer-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" />
      </form>

      <p id="feedback" class="feedback" aria-live="polite"></p>
      <button id="next-btn" hidden>Next word</button>
    </section>

    <section id="summary-screen" class="screen" hidden>
      <h2>Session complete!</h2>
      <p id="summary-score"></p>

      <div id="summary-missed-section" hidden>
        <h3>Words to practice</h3>
        <ul id="summary-missed-list"></ul>
        <button id="retest-missed-btn">Retest missed words now</button>
      </div>

      <div id="summary-correct-section" hidden>
        <h3>Words you got right</h3>
        <ul id="summary-correct-list"></ul>
      </div>

      <div class="summary-actions">
        <button id="restart-btn">Practice again</button>
        <button id="summary-history-btn" class="secondary-btn">View history</button>
      </div>
    </section>

    <section id="history-screen" class="screen" hidden>
      <h2>Session History</h2>
      <p id="history-empty" class="note" hidden>No sessions yet — finish a practice session to see it here.</p>
      <ul id="history-list"></ul>
      <button id="history-back-btn" class="secondary-btn">Back</button>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
